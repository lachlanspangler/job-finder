<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Job Finder — tech · AI · quant</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="hero">
      <h1>Job Finder</h1>
      <p class="sub">New-grad &amp; mid-level roles at top tech, AI, and quant companies — pulled daily from Greenhouse &amp; Ashby.</p>
      <p id="meta" class="meta">Loading…</p>
    </header>

    <section class="controls">
      <input id="search" type="search" placeholder="Search title, company, or location…" autocomplete="off" />
      <div id="tags" class="tags"></div>
    </section>

    <main id="list" class="list"></main>
    <footer class="foot">
      Data from public Greenhouse/Ashby board APIs. Not affiliated with any listed company.
    </footer>

    <script src="./app.js" defer></script>
  </body>
</html>
